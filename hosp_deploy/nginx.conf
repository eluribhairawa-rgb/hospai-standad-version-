# Included inside nginx's http{} block. Plain HTTP only: TLS ends at the edge proxy.

log_format app '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
               '$status $body_bytes_sent rt=$request_time "$http_user_agent"';

# Real client IP comes from the edge proxy; trust only the edge proxy and local Docker ranges.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.1.65;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Did the browser use HTTPS at the edge?
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $fwd_proto $hsts {
    default "";
    https   "max-age=31536000";
}

# Cache policy per path (kept in a map so no location needs its own add_header).
map $uri $cache_ctl {
    default            "no-cache";
    ~^/api/            "no-store";
    ~^/assets/         "public, max-age=31536000, immutable";
    ~\.(png|svg|ico)$  "public, max-age=86400";
}

# Brute-force protection: only login and platform routes land in this zone.
# An empty key means "not counted", so every other URL is unaffected.
map $uri $auth_key {
    default                          "";
    ~^/api/(admin/)?auth/login       $binary_remote_addr;
    ~^/api/platform/                 $binary_remote_addr;
}

limit_req_zone  $binary_remote_addr zone=api_all:10m  rate=50r/s;
limit_req_zone  $auth_key           zone=api_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout app;

    client_header_timeout 15s;
    client_body_timeout   30s;
    send_timeout          30s;
    keepalive_timeout     30s;
    client_max_body_size  25m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;
    limit_conn conn_ip 100;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    # Security headers. All at server level only (a location-level add_header
    # would silently drop these).
    add_header X-Content-Type-Options       "nosniff" always;
    add_header X-Frame-Options              "SAMEORIGIN" always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy   "same-origin-allow-popups" always;
    add_header Strict-Transport-Security    $hsts always;
    add_header Cache-Control                $cache_ctl always;
    add_header Content-Security-Policy      "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' blob:; frame-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Compress static text only (not JSON, which can carry patient data).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve hidden files.
    location ~ /\. {
        return 404;
    }

    # Unused by the frontend: public self-registration and multi-tenant onboarding stay closed
    location ^~ /api/auth/signup         { return 404; }
    location ^~ /api/auth/check-username { return 404; }
    location ^~ /api/auth/setup-admin    { return 404; }
    location ^~ /api/platform/           { return 404; }

    location /api/ {
        limit_req zone=api_all  burst=100 nodelay;
        limit_req zone=api_auth burst=10  nodelay;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_request_buffering off;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
